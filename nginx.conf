server {
    listen 8089;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Maintenance page: every path serves index.html with a 503 so crawlers don't index it.
    location = /favicon.ico {
        try_files /favicon.ico =404;
    }

    location / {
        add_header Retry-After 3600 always;
        error_page 503 /index.html;
        return 503;
    }

    location = /index.html {
        internal;
    }
}
